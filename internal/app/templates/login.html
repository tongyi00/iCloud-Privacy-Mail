<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - iCloud Privacy Mail</title>
  <style>
    /* ===== 设计令牌层：与 index.html / manage.html 保持一致，见 docs/DESIGN.md ===== */
    :root {
      color-scheme: light;

      --bg:             oklch(99% 0.002 240);
      --surface:        oklch(100% 0 0);
      --surface-sunken: oklch(97.5% 0.003 250);
      --surface-hover:  oklch(97% 0.004 250);
      --fg:             oklch(18% 0.012 250);
      --fg-secondary:   oklch(38% 0.012 250);
      --muted:          oklch(54% 0.012 250);
      --border:         oklch(92% 0.005 250);
      --border-strong:  oklch(86% 0.006 250);

      --accent:         oklch(58% 0.18 255);
      --accent-fg:      oklch(100% 0 0);
      --accent-hover:   oklch(52% 0.18 255);
      --accent-text:    oklch(48% 0.19 255);

      --success:        oklch(48% 0.13 155);
      --success-bg:     oklch(96.5% 0.03 155);
      --success-border: oklch(85% 0.07 155);
      --danger:         oklch(52% 0.19 25);
      --danger-bg:      oklch(96.5% 0.03 25);
      --danger-border:  oklch(86% 0.08 25);
      --danger-glow:    oklch(52% 0.19 25 / 0.16);

      --focus-ring:     oklch(58% 0.18 255);
      --accent-glow:    oklch(58% 0.18 255 / 0.16);

      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "PingFang SC", "HarmonyOS Sans SC", "MiSans",
                   "Microsoft YaHei UI", system-ui, sans-serif;

      --radius-md: 6px; --radius-lg: 8px;
      --shadow-modal: 0 16px 40px oklch(20% 0.02 250 / 0.14),
                      0 2px 6px   oklch(20% 0.02 250 / 0.08);
      --dur: 140ms;
      --ease: cubic-bezier(0.2, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg:             oklch(16% 0.008 255);
      --surface:        oklch(19.5% 0.009 255);
      --surface-sunken: oklch(17.5% 0.008 255);
      --surface-hover:  oklch(23% 0.010 255);
      --fg:             oklch(96% 0.004 250);
      --fg-secondary:   oklch(80% 0.008 250);
      --muted:          oklch(65% 0.010 250);
      --border:         oklch(28% 0.010 255);
      --border-strong:  oklch(36% 0.012 255);
      --accent:         oklch(62% 0.17 255);
      --accent-fg:      oklch(16% 0.01 255);
      --accent-hover:   oklch(68% 0.16 255);
      --accent-text:    oklch(76% 0.13 255);
      --success:        oklch(76% 0.15 158);
      --success-bg:     oklch(26% 0.05 158);
      --success-border: oklch(38% 0.08 158);
      --danger:         oklch(72% 0.16 25);
      --danger-bg:      oklch(28% 0.07 25);
      --danger-border:  oklch(42% 0.11 25);
      --danger-glow:    oklch(72% 0.16 25 / 0.22);
      --focus-ring:     oklch(70% 0.15 255);
      --accent-glow:    oklch(70% 0.15 255 / 0.22);
      --shadow-modal:   0 16px 40px oklch(0% 0 0 / 0.5);
    }

    * { box-sizing: border-box; }
    /* 单列居中卡片，页面背景为纯色（去掉原 radial-gradient 双栏 hero） */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 400 14px/22px var(--font-body);
      color: var(--fg);
      background: var(--bg);
    }
    .wrap { width: min(400px, 100%); }
    .page-title { margin: 0 0 20px; text-align: center; }
    h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
    .page-title p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 18px; }
    .card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-modal);
    }
    /* 登录/注册用下划线式标签页，不用胶囊填充按钮 */
    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      padding: 0 0 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .tabs button:hover { color: var(--fg); }
    .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
    .tabs button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 16px;
      color: var(--fg-secondary);
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }
    input {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--fg);
      font: 400 14px/22px var(--font-body);
      outline: none;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    input::placeholder { color: var(--muted); }
    input:hover { border-color: var(--muted); }
    input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    input[aria-invalid="true"] { border-color: var(--danger); }
    input[aria-invalid="true"]:focus-visible { box-shadow: 0 0 0 3px var(--danger-glow); }
    /* 必填星号只作视觉标记，语义由 input 的 required 提供 */
    label.req > span:first-child::after { content: "*"; margin-left: 4px; color: var(--danger); }
    /* 校验提示预留 18px 行高，报错时不产生跳动 */
    .field-error {
      display: block;
      min-height: 18px;
      margin-top: 6px;
      color: var(--danger);
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }
    .actions { margin-top: 20px; }
    /* 页面唯一实心按钮，满宽 */
    button.primary {
      width: 100%;
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--dur) var(--ease);
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button.primary:disabled { background: var(--surface-sunken); color: var(--muted); border-color: var(--border); cursor: not-allowed; }
    .notice {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--success-border);
      border-radius: var(--radius-md);
      background: var(--success-bg);
      color: var(--success);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .notice[hidden] { display: none; }
    .notice.err { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger); }
    /* 移动端触达目标不小于 44px */
    @media (max-width: 680px) {
      input, button.primary { min-height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="page-title">
      <h1>iCloud Privacy Mail</h1>
      <p>登录后管理 iCloud 隐私邮箱和验证码 API。</p>
    </div>
    <section class="card">
      <div class="tabs" role="tablist" aria-label="登录或注册">
        <button id="loginTab" class="active" role="tab" aria-selected="true" onclick="switchMode('login')">登录</button>
        <button id="registerTab" role="tab" aria-selected="false" onclick="switchMode('register')">注册</button>
      </div>
      <label class="req" for="username"><span>账号</span><input id="username" autocomplete="username" required aria-describedby="usernameError" placeholder="例如 admin 或 user@example.com"><span class="field-error" id="usernameError" role="alert"></span></label>
      <label class="req" for="password"><span>密码</span><input id="password" type="password" autocomplete="current-password" required aria-describedby="passwordError" placeholder="至少 6 位"><span class="field-error" id="passwordError" role="alert"></span></label>
      <div class="actions">
        <button class="primary" id="submitButton" onclick="submitAuth()">登录</button>
      </div>
      <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script>
    let mode = 'login';
    const $ = id => document.getElementById(id);

    // 与面板共用 ipm_theme 存储键；无存储值时跟随系统明暗偏好
    (function initTheme() {
      let saved = '';
      try { saved = localStorage.getItem('ipm_theme') || ''; } catch (_) {}
      if (saved !== 'light' && saved !== 'dark') {
        const prefersDark = window.matchMedia
          && window.matchMedia('(prefers-color-scheme: dark)').matches;
        saved = prefersDark ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = saved;
    })();

    function switchMode(next) {
      mode = next;
      const isLogin = mode === 'login';
      $('loginTab').classList.toggle('active', isLogin);
      $('registerTab').classList.toggle('active', !isLogin);
      // 标签页语义状态需与视觉状态同步，供读屏软件播报
      $('loginTab').setAttribute('aria-selected', String(isLogin));
      $('registerTab').setAttribute('aria-selected', String(!isLogin));
      $('submitButton').textContent = isLogin ? '登录' : '注册并登录';
      clearNotice();
      clearFieldErrors();
    }
    function setNotice(text, isErr=false) {
      $('notice').textContent = text;
      $('notice').classList.toggle('err', isErr);
      $('notice').hidden = !text;
    }
    function clearNotice() {
      setNotice('');
    }
    // 字段级校验提示：错误文案就近显示，并同步 aria-invalid 供读屏软件识别
    function setFieldError(id, text) {
      const input = $(id);
      const slot = $(id + 'Error');
      if (slot) slot.textContent = text || '';
      if (!input) return;
      if (text) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
    }
    function clearFieldErrors() {
      setFieldError('username', '');
      setFieldError('password', '');
    }
    async function submitAuth() {
      const username = $('username').value.trim();
      const password = $('password').value;
      clearFieldErrors();
      let firstInvalid = '';
      if (!username) { setFieldError('username', '请输入账号'); firstInvalid = firstInvalid || 'username'; }
      // 注册时密码长度有下限，登录时只校验非空，避免对历史账号误报
      if (!password) { setFieldError('password', '请输入密码'); firstInvalid = firstInvalid || 'password'; }
      else if (mode === 'register' && password.length < 6) {
        setFieldError('password', '密码至少 6 位');
        firstInvalid = firstInvalid || 'password';
      }
      if (firstInvalid) {
        clearNotice();
        $(firstInvalid).focus();
        return;
      }
      $('submitButton').disabled = true;
      try {
        const res = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || data.code || `HTTP ${res.status}`);
        setNotice(`${mode === 'login' ? '登录' : '注册'}成功：${data.user.username}${data.user.is_admin ? ' / 管理员' : ''}`);
        location.href = '/';
      } catch (err) {
        setNotice(err.message, true);
      } finally {
        $('submitButton').disabled = false;
      }
    }
    fetch('/api/auth/me', {credentials:'same-origin'})
      .then(r => r.json())
      .then(data => { if (data.authenticated) location.href = '/'; })
      .catch(() => {});
  </script>
</body>
</html>
